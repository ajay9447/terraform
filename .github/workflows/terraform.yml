name: Terraform Deploy

on:
  push:
    branches:
      - ajay
    paths:
      - 'git-terrform/**'
      - '.github/workflows/terraform.yml'

  pull_request:
    branches:
      - ajay
    paths:
      - 'git-terrform/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:

  # ============================================================
  # Terraform Plan
  # Runs for Pull Requests and Pushes to ajay
  # ============================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./git-terrform

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Setup Terraform
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # -------------------------
      # Configure AWS using OIDC
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Verify AWS authentication
      # -------------------------
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # -------------------------
      # Terraform Format
      # -------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # -------------------------
      # Terraform Init
      # -------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------
      # Terraform Validate
      # -------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------
      # Terraform Plan
      # -------------------------
      - name: Terraform Plan
        run: terraform plan -no-color


  # ============================================================
  # Terraform Apply
  # Only runs after successful Plan
  # Only runs on push to ajay
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    # Apply ONLY on push to ajay
    if: github.event_name == 'push' && github.ref == 'refs/heads/ajay'

    defaults:
      run:
        shell: bash
        working-directory: ./git-terrform

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Setup Terraform
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # -------------------------
      # Configure AWS using OIDC
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Verify AWS authentication
      # -------------------------
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # -------------------------
      # Terraform Init
      # -------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------
      # Terraform Apply
      # -------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
